<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syria Recharge</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0d1117;
      color: white;
    }

    .header {
      background: #161b22;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #30363d;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      color: #8b949e;
      margin-top: 8px;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #c9d1d9;
    }

    input, select {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2f81f7;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    .network {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .network button {
      margin-top: 0;
      background: #21262d;
      border: 1px solid #30363d;
    }

    .network button.active {
      background: #1f6feb;
    }

    .result {
      display: none;
      background: #0d2818;
      border: 1px solid #238636;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
      line-height: 1.8;
    }

    .footer {
      text-align: center;
      color: #8b949e;
      padding: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📱 Syria Recharge</h1>
    <p>سورىيەدىكى كارتا ۋە نومۇر قاچىلاش مۇلازىمىتى</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>💳 رېچارج قىلىش</h2>

      <label>تور تاللاڭ</label>

      <div class="network">
        <button type="button" id="syriaTel" class="active"
          onclick="chooseNetwork('SyriaTel')">
          SyriaTel
        </button>

        <button type="button" id="mtn"
          onclick="chooseNetwork('MTN')">
          MTN
        </button>
      </div>

      <label for="phone">تېلېفون نومۇرى</label>
      <input
        id="phone"
        type="tel"
        placeholder="09xxxxxxxx"
        maxlength="10">

      <label for="amount">قاچىلاش سوممىسى</label>

      <select id="amount">
        <option value="1000">1,000 ل.س</option>
        <option value="2500">2,500 ل.س</option>
        <option value="5000">5,000 ل.س</option>
        <option value="10000">10,000 ل.س</option>
        <option value="25000">25,000 ل.س</option>
      </select>

      <button onclick="recharge()">
        قاچىلاشنى داۋاملاشتۇرۇش
      </button>

      <div class="result" id="result"></div>
    </div>

    <div class="card">
      <h2>📋 مۇلازىمەت</h2>
      <p>• SyriaTel رېچارج</p>
      <p>• MTN رېچارج</p>
      <p>• كېيىنچە ئەپ/ئويۇن رېچارج</p>
      <p>• زاكاز تارىخى</p>
      <p>• ئىشلەتكۈچى ھېساباتى</p>
    </div>

  </div>

  <div class="footer">
    © 2026 Syria Recharge
  </div>

  <script>
    let network = "SyriaTel";

    function chooseNetwork(name) {
      network = name;

      document.getElementById("syriaTel").classList.remove("active");
      document.getElementById("mtn").classList.remove("active");

      if (name === "SyriaTel") {
        document.getElementById("syriaTel").classList.add("active");
      } else {
        document.getElementById("mtn").classList.add("active");
      }
    }

    function recharge() {
      const phone = document.getElementById("phone").value.trim();
      const amount = document.getElementById("amount").value;
      const result = document.getElementById("result");

      if (phone.length < 9) {
        alert("تېلېفون نومۇرىنى توغرا كىرگۈزۈڭ!");
        return;
      }

      result.style.display = "block";

      result.innerHTML =
        "✅ زاكاز ئۇچۇرى تەييار!<br><br>" +
        "📡 تور: " + network + "<br>" +
        "📱 نومۇر: " + phone + "<br>" +
        "💰 سومما: " + Number(amount).toLocaleString() + " ل.س<br><br>" +
        "⚠️ ھازىرچە بۇ Demo نۇسخا. ھەقىقىي رېچارج تېخى ئۇلانمىدى.";
    }
  </script>

</body>
</html>
